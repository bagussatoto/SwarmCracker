<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" aria-labelledby="archTitle archDesc" role="img" viewBox="0 0 1200 800"><title id="archTitle">SwarmCracker executor pipeline</title><desc id="archDesc">SwarmKit manager sends tasks to the agent, which delegates to the SwarmCracker executor. The executor translates tasks, prepares images, sets up networking, and launches Firecracker microVMs via KVM.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1b1d20" d="M0 0 L10 5 L0 10 z"/></marker><pattern id="corrugate" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#868c93"/><rect width="2.5" height="14" x="0" fill="#6f757b"/></pattern><style>.hd,.t{font-family:&apos;Arial Narrow&apos;,&apos;Helvetica Neue&apos;,Arial,sans-serif}.hd{font-weight:700;letter-spacing:.06em}.mono{font-family:&apos;SFMono-Regular&apos;,Menlo,Consolas,monospace;letter-spacing:.04em}</style></defs><rect width="1200" height="800" fill="#fbfaf7"/><rect width="1172" height="772" x="14" y="14" fill="none" stroke="#1b1d20" stroke-width="3"/><rect width="1172" height="62" x="14" y="14" fill="#1b1d20"/><text x="40" y="54" fill="#f5c518" class="hd" font-size="26">SWARMCRACKER — EXECUTOR PIPELINE</text><text x="1148" y="52" fill="#fbfaf7" class="mono" font-size="15" text-anchor="end">v0.11.0</text><text x="40" y="120" fill="#a33d08" class="mono" font-size="15">ORCHESTRATION</text><text x="40" y="312" fill="#a33d08" class="mono" font-size="15">EXECUTOR</text><text x="40" y="524" fill="#a33d08" class="mono" font-size="15">ISOLATION</text><line x1="40" x2="1160" y1="132" y2="132" stroke="#c3c0b8" stroke-width="1"/><line x1="40" x2="1160" y1="324" y2="324" stroke="#c3c0b8" stroke-width="1"/><line x1="40" x2="1160" y1="536" y2="536" stroke="#c3c0b8" stroke-width="1"/><g fill="#1b1d20" class="t" font-size="21"><rect width="290" height="96" x="70" y="168" fill="#e8e6e0" stroke="#1b1d20" stroke-width="2.5"/><text x="215" y="205" class="hd" font-size="22" text-anchor="middle">SWARMKIT MANAGER</text><text x="215" y="234" fill="#565c63" class="mono" font-size="14" text-anchor="middle">schedules services</text><rect width="290" height="96" x="455" y="168" fill="#e8e6e0" stroke="#1b1d20" stroke-width="2.5"/><text x="600" y="205" class="hd" font-size="22" text-anchor="middle">SWARMKIT AGENT</text><text x="600" y="234" fill="#565c63" class="mono" font-size="14" text-anchor="middle">receives tasks</text><rect width="290" height="96" x="840" y="168" fill="#e4570f" stroke="#1b1d20" stroke-width="2.5"/><text x="985" y="205" class="hd" font-size="22" text-anchor="middle">SWARMCRACKER EXECUTOR</text><text x="985" y="234" fill="#1b1d20" class="mono" font-size="14" text-anchor="middle">orchestrates VM lifecycle</text></g><line x1="360" x2="450" y1="216" y2="216" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="745" x2="835" y1="216" y2="216" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/><g fill="#1b1d20" class="t" font-size="19"><rect width="255" height="120" x="70" y="360" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/><text x="197" y="402" class="hd" font-size="20" text-anchor="middle">TASK</text><text x="197" y="426" class="hd" font-size="20" text-anchor="middle">TRANSLATOR</text><text x="197" y="456" fill="#565c63" class="mono" font-size="13" text-anchor="middle">task → VM config</text><rect width="255" height="120" x="345" y="360" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/><text x="472" y="402" class="hd" font-size="20" text-anchor="middle">IMAGE</text><text x="472" y="426" class="hd" font-size="20" text-anchor="middle">PREPARER</text><text x="472" y="456" fill="#565c63" class="mono" font-size="13" text-anchor="middle">OCI → rootfs</text><rect width="255" height="120" x="620" y="360" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/><text x="747" y="402" class="hd" font-size="20" text-anchor="middle">NETWORK</text><text x="747" y="426" class="hd" font-size="20" text-anchor="middle">MANAGER</text><text x="747" y="456" fill="#565c63" class="mono" font-size="13" text-anchor="middle">TAP + VXLAN</text><rect width="255" height="120" x="895" y="360" fill="#fbfaf7" stroke="#1b1d20" stroke-width="2.5"/><text x="1022" y="402" class="hd" font-size="20" text-anchor="middle">VMM</text><text x="1022" y="426" class="hd" font-size="20" text-anchor="middle">MANAGER</text><text x="1022" y="456" fill="#565c63" class="mono" font-size="13" text-anchor="middle">Firecracker API</text></g><path fill="none" stroke="#1b1d20" stroke-width="2.5" d="M985 264 L985 300 L197 300 L197 355"/><path fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)" d="M472 300 L472 355"/><path fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)" d="M747 300 L747 355"/><path fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)" d="M1022 300 L1022 355"/><line x1="985" x2="197" y1="300" y2="300" stroke="#1b1d20" stroke-width="2.5"/><line x1="197" x2="197" y1="300" y2="355" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)"/><g fill="#1b1d20" class="t" font-size="19"><rect width="255" height="96" x="895" y="572" fill="#e8e6e0" stroke="#1b1d20" stroke-width="2.5"/><text x="1022" y="614" class="hd" font-size="20" text-anchor="middle">FIRECRACKER VMM</text><text x="1022" y="642" fill="#565c63" class="mono" font-size="13" text-anchor="middle">one process per VM</text></g><path fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)" d="M1022 480 L1022 566"/><rect width="780" height="120" x="70" y="560" fill="none" stroke="#a33d08" stroke-dasharray="10 7" stroke-width="3"/><text x="90" y="588" fill="#a33d08" class="mono" font-size="14">KVM HARDWARE BOUNDARY</text><g><rect width="220" height="60" x="100" y="600" fill="url(#corrugate)" stroke="#1b1d20" stroke-width="2.5"/><text x="210" y="637" fill="#fbfaf7" class="mono" font-size="15" text-anchor="middle">microVM web.1</text><rect width="220" height="60" x="340" y="600" fill="url(#corrugate)" stroke="#1b1d20" stroke-width="2.5"/><text x="450" y="637" fill="#fbfaf7" class="mono" font-size="15" text-anchor="middle">microVM web.2</text><rect width="220" height="60" x="580" y="600" fill="url(#corrugate)" stroke="#1b1d20" stroke-width="2.5"/><text x="690" y="637" fill="#fbfaf7" class="mono" font-size="15" text-anchor="middle">microVM web.3</text></g><path fill="none" stroke="#1b1d20" stroke-width="2.5" marker-end="url(#arrow)" d="M895 620 L810 620"/><text x="40" y="746" fill="#565c63" class="mono" font-size="14">Each microVM boots its own Linux kernel; the host kernel is never shared.</text></svg>